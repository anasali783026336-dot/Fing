name: Android CI - RaqeebNet / NetPulse Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Verify SDK Components
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Error: ANDROID_HOME / ANDROID_SDK_ROOT is not set."
            exit 1
          fi
          echo "Using Android SDK at: $SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" > /dev/null || true
          fi

      - name: Restore Debug Keystore if needed
        env:
          DEBUG_KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -f "debug.keystore" ] && [ -s "debug.keystore" ]; then
            echo "Existing debug.keystore found."
          elif [ -n "$DEBUG_KEYSTORE_SECRET" ]; then
            echo "Restoring debug.keystore from GitHub Secret..."
            echo "$DEBUG_KEYSTORE_SECRET" | base64 --decode > debug.keystore
          elif [ -f "debug.keystore.base64" ] && [ -s "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "Generating standard Android debug.keystore with keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          set -e
          if [ ! -f "./gradlew" ]; then
            echo "Error: ./gradlew not found in project root $(pwd)"
            exit 1
          fi
          chmod +x ./gradlew

      - name: Validate Gradle Wrapper
        run: |
          set -e
          for required_file in "./gradlew" "./gradle/wrapper/gradle-wrapper.jar" "./gradle/wrapper/gradle-wrapper.properties"; do
            if [ ! -f "$required_file" ] || [ ! -s "$required_file" ]; then
              echo "Error: Missing or empty Gradle Wrapper file: $required_file"
              exit 1
            fi
          done
          grep -E "^distributionUrl=https\\://services\.gradle\.org/distributions/gradle-.*-bin\.zip$" ./gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version --no-daemon

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Generated
        run: |
          set -e
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected Debug APK was not found at $APK_PATH"
            find app/build/outputs -type f || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: Debug APK at $APK_PATH is empty (0 bytes)."
            exit 1
          fi
          echo "Verified Debug APK successfully generated:"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaqeebNet-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
